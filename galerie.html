<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Galerie — MarťasDesign</title>

<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;800&display=swap" rel="stylesheet">

<style>
:root {
    --primary: #ff3b3b;
    --primary-light: #ff5e5e;
    --dark: #111111;
    --card: #1e1e1e;
    --muted: #bdbdbd;
    --white: #ffffff;
}

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    font-family: 'Montserrat', sans-serif;
}

html {
    scroll-behavior: smooth;
}

body {
    background: radial-gradient(circle at top, #3a0000, #151515);
    color: var(--white);
    min-height: 100vh;
    overflow-x: hidden;
}

.flame-bg {
    position: fixed;
    inset: 0;
    background:
        radial-gradient(circle at 20% 120%, rgba(255,80,0,0.3), transparent 70%),
        radial-gradient(circle at 80% 120%, rgba(255,20,0,0.22), transparent 70%),
        radial-gradient(circle at 50% 120%, rgba(255,120,0,0.2), transparent 70%);
    filter: blur(60px);
    animation: flames 5s infinite alternate ease-in-out;
    z-index: -1;
}

@keyframes flames {
    from {
        transform: translateY(0);
    }

    to {
        transform: translateY(-30px);
    }
}

.navbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 20px;
    padding: 16px 30px;
    background: rgba(20,20,20,0.88);
    backdrop-filter: blur(10px);
    position: sticky;
    top: 0;
    z-index: 1000;
    border-bottom: 1px solid rgba(255,255,255,0.04);
}

.logo {
    color: var(--primary);
    font-size: 1.6rem;
    font-weight: 800;
}

.nav-right {
    display: flex;
    align-items: center;
    gap: 20px;
}

.back-button {
    color: white;
    text-decoration: none;
    font-weight: 700;
    transition: 0.3s;
}

.back-button:hover {
    color: var(--primary-light);
}

.cart {
    position: relative;
    color: white;
    font-size: 1.7rem;
    cursor: pointer;
    text-decoration: none;
    display: flex;
    align-items: center;
}

.cart-count {
    position: absolute;
    top: -9px;
    right: -11px;
    background: white;
    color: var(--primary);
    min-width: 20px;
    height: 20px;
    border-radius: 50%;
    display: flex;
    justify-content: center;
    align-items: center;
    font-size: 0.72rem;
    font-weight: 800;
}

header {
    text-align: center;
    padding: 45px 20px 30px;
}

header h1 {
    font-size: 2.8rem;
    color: var(--primary);
    margin-bottom: 12px;
}

header p {
    color: #ddd;
    font-size: 1rem;
}

.search-area {
    max-width: 700px;
    margin: 0 auto 25px;
    padding: 0 20px;
}

.search-input {
    width: 100%;
    padding: 15px 20px;
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: 30px;
    outline: none;
    background: rgba(10,10,10,0.8);
    color: white;
    font-size: 1rem;
}

.search-input:focus {
    border-color: var(--primary);
}

.categories {
    max-width: 1200px;
    margin: 0 auto;
    padding: 0 20px 30px;
    display: flex;
    justify-content: center;
    flex-wrap: wrap;
    gap: 10px;
}

.category-btn {
    border: none;
    background: rgba(255,255,255,0.06);
    color: white;
    padding: 10px 17px;
    border-radius: 25px;
    cursor: pointer;
    font-weight: 700;
    transition: 0.25s;
}

.category-btn:hover {
    background: rgba(255,255,255,0.12);
}

.category-btn.active {
    background: linear-gradient(90deg, var(--primary), var(--primary-light));
    box-shadow: 0 5px 20px rgba(255,60,60,0.2);
}

.gallery {
    max-width: 1200px;
    margin: 0 auto;
    padding: 10px 20px 60px;
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
    gap: 25px;
}

.card {
    background: rgba(30,30,30,0.9);
    border-radius: 16px;
    overflow: hidden;
    box-shadow: 0 8px 25px rgba(0,0,0,0.5);
    transition: 0.25s;
}

.card:hover {
    transform: translateY(-7px);
    box-shadow: 0 20px 40px rgba(255,60,60,0.15);
}

.product-image {
    width: 100%;
    height: 230px;
    object-fit: cover;
    display: block;
    background: #292929;
}

.card-content {
    padding: 18px;
    text-align: center;
}

.card-content h3 {
    font-size: 1.1rem;
    margin-bottom: 7px;
}

.category-name {
    color: var(--muted);
    font-size: 0.85rem;
    margin-bottom: 10px;
}

.price {
    color: var(--primary-light);
    font-weight: 800;
    font-size: 1.1rem;
    margin-bottom: 15px;
}

.add-button {
    width: 100%;
    border: none;
    background: var(--primary);
    color: white;
    padding: 11px 18px;
    border-radius: 25px;
    cursor: pointer;
    font-weight: 700;
    transition: 0.25s;
}

.add-button:hover {
    background: var(--primary-light);
    transform: scale(1.03);
}

.add-button.added {
    background: #27ae60;
}

.no-products {
    grid-column: 1 / -1;
    text-align: center;
    padding: 60px 20px;
    color: var(--muted);
}

footer {
    background: rgba(15,15,15,0.9);
    text-align: center;
    color: #ccc;
    padding: 30px 20px;
}

footer p {
    margin: 5px 0;
}

@media (max-width: 700px) {
    .navbar {
        padding: 15px;
    }

    .logo {
        font-size: 1.3rem;
    }

    .nav-right {
        gap: 12px;
    }

    .back-button {
        font-size: 0.85rem;
    }

    header h1 {
        font-size: 2.2rem;
    }

    .gallery {
        grid-template-columns: 1fr;
        padding-left: 15px;
        padding-right: 15px;
    }

    .product-image {
        height: 260px;
    }
}
</style>
</head>

<body>

<div class="flame-bg"></div>

<nav class="navbar">

    <div class="logo">
        MarťasDesign
    </div>

    <div class="nav-right">

        <a href="./index.html" class="back-button">
            Zpět
        </a>

        <a href="./kosik.html" class="cart" aria-label="Košík">
            🛒
            <span class="cart-count" id="cartCount">0</span>
        </a>

    </div>

</nav>

<header>
    <h1>Galerie produktů</h1>
    <p>Vyber si z našich exkluzivních návrhů.</p>
</header>

<div class="search-area">

    <input
        type="text"
        id="searchInput"
        class="search-input"
        placeholder="🔎 Hledat produkt..."
        autocomplete="off"
    >

</div>

<div class="categories" id="categories"></div>

<main>
    <div class="gallery" id="gallery"></div>
</main>

<footer>
    <p>© 2025 MarťasDesign BETA Version 0.4</p>
    <p>Navrženo s ❤️</p>
</footer>

<script>
const products = [

    {
        id: 1,
        name: "Čepice Classic",
        category: "Čepice",
        price: 499,
        image: "https://images.unsplash.com/photo-1521369909029-2afed882baee?auto=format&fit=crop&w=800&q=80"
    },

    {
        id: 2,
        name: "Čepice Sport",
        category: "Čepice",
        price: 549,
        image: "https://images.unsplash.com/photo-1575428652377-a2d80e2277fc?auto=format&fit=crop&w=800&q=80"
    },

    {
        id: 3,
        name: "Čepice Street",
        category: "Čepice",
        price: 599,
        image: "https://images.unsplash.com/photo-1576871337632-b9aef4c17ab9?auto=format&fit=crop&w=800&q=80"
    },

    {
        id: 4,
        name: "Mikina Comfort",
        category: "Mikiny",
        price: 999,
        image: "https://images.unsplash.com/photo-1556821840-3a63f95609a7?auto=format&fit=crop&w=800&q=80"
    },

    {
        id: 5,
        name: "Mikina Oversize",
        category: "Mikiny",
        price: 1199,
        image: "https://images.unsplash.com/photo-1578681994506-b8f463449011?auto=format&fit=crop&w=800&q=80"
    },

    {
        id: 6,
        name: "Mikina Street",
        category: "Mikiny",
        price: 1099,
        image: "https://images.unsplash.com/photo-1620799140408-edc6dcb6d633?auto=format&fit=crop&w=800&q=80"
    },

    {
        id: 7,
        name: "Tričko Basic",
        category: "Trička",
        price: 499,
        image: "https://images.unsplash.com/photo-1521572163474-6864f9cf17ab?auto=format&fit=crop&w=800&q=80"
    },

    {
        id: 8,
        name: "Tričko Premium",
        category: "Trička",
        price: 649,
        image: "https://images.unsplash.com/photo-1503341504253-dff4815485f1?auto=format&fit=crop&w=800&q=80"
    },

    {
        id: 9,
        name: "Tričko Urban",
        category: "Trička",
        price: 599,
        image: "https://images.unsplash.com/photo-1562157873-818bc0726f68?auto=format&fit=crop&w=800&q=80"
    },

    {
        id: 10,
        name: "Kraťasy Sport",
        category: "Kraťasy",
        price: 699,
        image: "https://images.unsplash.com/photo-1591195853828-11db59a44f6b?auto=format&fit=crop&w=800&q=80"
    },

    {
        id: 11,
        name: "Kraťasy Casual",
        category: "Kraťasy",
        price: 749,
        image: "https://images.unsplash.com/photo-1565084888279-aca607ecce0c?auto=format&fit=crop&w=800&q=80"
    },

    {
        id: 12,
        name: "Kalhoty Cargo",
        category: "Kalhoty",
        price: 1099,
        image: "https://images.unsplash.com/photo-1624378439575-d8705ad7ae80?auto=format&fit=crop&w=800&q=80"
    },

    {
        id: 13,
        name: "Kalhoty Classic",
        category: "Kalhoty",
        price: 999,
        image: "https://images.unsplash.com/photo-1473966968600-fa801b869a1a?auto=format&fit=crop&w=800&q=80"
    },

    {
        id: 14,
        name: "Boty Sport",
        category: "Boty",
        price: 1499,
        image: "https://images.unsplash.com/photo-1542291026-7eec264c27ff?auto=format&fit=crop&w=800&q=80"
    },

    {
        id: 15,
        name: "Boty Classic",
        category: "Boty",
        price: 1699,
        image: "https://images.unsplash.com/photo-1549298916-b41d501d3772?auto=format&fit=crop&w=800&q=80"
    },

    {
        id: 16,
        name: "Koberec Modern",
        category: "Koberce",
        price: 1899,
        image: "https://images.unsplash.com/photo-1600166898405-da9535204843?auto=format&fit=crop&w=800&q=80"
    },

    {
        id: 17,
        name: "Koberec Cozy",
        category: "Koberce",
        price: 2199,
        image: "https://images.unsplash.com/photo-1600566753086-00f18fb6b3ea?auto=format&fit=crop&w=800&q=80"
    }

];

const gallery = document.getElementById("gallery");
const categoriesElement = document.getElementById("categories");
const searchInput = document.getElementById("searchInput");
const cartCount = document.getElementById("cartCount");

let selectedCategory = "Vše";

let cart = JSON.parse(localStorage.getItem("martasdesignCart")) || [];

function saveCart() {
    localStorage.setItem(
        "martasdesignCart",
        JSON.stringify(cart)
    );
}

function updateCartCount() {
    const totalItems = cart.reduce(
        (total, item) => total + item.quantity,
        0
    );

    cartCount.textContent = totalItems;
}

function addToCart(product) {

    const existingProduct = cart.find(
        item => item.id === product.id
    );

    if (existingProduct) {

        existingProduct.quantity += 1;

    } else {

        cart.push({
            id: product.id,
            name: product.name,
            category: product.category,
            price: product.price,
            image: product.image,
            quantity: 1
        });

    }

    saveCart();
    updateCartCount();

    const buttons =
        document.querySelectorAll(".add-button");

    buttons.forEach(button => {

        if (
            Number(button.dataset.id) === product.id
        ) {

            const oldText = button.textContent;

            button.textContent = "✓ Přidáno";

            button.classList.add("added");

            setTimeout(() => {

                button.textContent = oldText;

                button.classList.remove("added");

            }, 1000);

        }

    });
}

const categories = [
    "Vše",
    ...new Set(
        products.map(product => product.category)
    )
];

function renderCategories() {

    categoriesElement.innerHTML = "";

    categories.forEach(category => {

        const button =
            document.createElement("button");

        button.className = "category-btn";

        if (category === selectedCategory) {
            button.classList.add("active");
        }

        button.textContent = category;

        button.addEventListener(
            "click",
            function() {

                selectedCategory = category;

                renderCategories();
                renderProducts();

            }
        );

        categoriesElement.appendChild(button);

    });
}

function renderProducts() {

    gallery.innerHTML = "";

    const search =
        searchInput.value
            .toLowerCase()
            .trim();

    const filteredProducts =
        products.filter(product => {

            const categoryMatch =
                selectedCategory === "Vše" ||
                product.category === selectedCategory;

            const searchMatch =
                product.name
                    .toLowerCase()
                    .includes(search);

            return categoryMatch && searchMatch;
        });

    if (filteredProducts.length === 0) {

        gallery.innerHTML = `
            <div class="no-products">
                Žádné produkty nebyly nalezeny.
            </div>
        `;

        return;
    }

    filteredProducts.forEach(product => {

        const card =
            document.createElement("div");

        card.className = "card";

        card.innerHTML = `
            <img
                src="${product.image}"
                alt="${product.name}"
                class="product-image"
                loading="lazy"
            >

            <div class="card-content">

                <h3>
                    ${product.name}
                </h3>

                <div class="category-name">
                    ${product.category}
                </div>

                <div class="price">
                    ${product.price.toLocaleString("cs-CZ")} Kč
                </div>

                <button
                    class="add-button"
                    data-id="${product.id}"
                >
                    🛒 Přidat do košíku
                </button>

            </div>
        `;

        const button =
            card.querySelector(".add-button");

        button.addEventListener(
            "click",
            function() {
                addToCart(product);
            }
        );

        gallery.appendChild(card);

    });
}

searchInput.addEventListener(
    "input",
    function() {
        renderProducts();
    }
);

renderCategories();
renderProducts();
updateCartCount();
</script>

</body>
</html>
