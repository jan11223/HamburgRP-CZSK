<!DOCTYPE html>
<html lang="cs">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Galerie — MarťasDesign</title>

<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;800&display=swap" rel="stylesheet">

<style>

/* =====================================================
   TEST 1 — ZÁKLADNÍ VZHLED
   ===================================================== */

:root {
    --primary: #ff3b3b;
    --primary-light: #ff5e5e;
    --dark: #111111;
    --card: #1e1e1e;
    --muted: #bdbdbd;
    --white: #ffffff;
}

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    font-family: 'Montserrat', sans-serif;
}

body {
    background: radial-gradient(circle at top, #3a0000, #151515);
    color: white;
    min-height: 100vh;
}


/* =====================================================
   TEST 2 — ANIMOVANÉ POZADÍ
   ===================================================== */

.flame-bg {
    position: fixed;
    inset: 0;

    background:
        radial-gradient(
            circle at 20% 120%,
            rgba(255, 80, 0, 0.30),
            transparent 70%
        ),

        radial-gradient(
            circle at 80% 120%,
            rgba(255, 20, 0, 0.25),
            transparent 70%
        ),

        radial-gradient(
            circle at 50% 120%,
            rgba(255, 120, 0, 0.22),
            transparent 70%
        );

    filter: blur(60px);

    animation: flames 5s infinite alternate ease-in-out;

    z-index: -1;
}

@keyframes flames {

    from {
        transform: translateY(0);
    }

    to {
        transform: translateY(-30px);
    }
}


/* =====================================================
   TEST 3 — NAVBAR
   ===================================================== */

.navbar {
    position: sticky;
    top: 0;

    z-index: 1000;

    display: flex;
    justify-content: space-between;
    align-items: center;

    padding: 1rem 1.5rem;

    background: rgba(20, 20, 20, 0.85);

    backdrop-filter: blur(10px);

    border-bottom: 1px solid rgba(255,255,255,0.05);
}

.logo {
    color: var(--primary);

    font-size: 1.5rem;

    font-weight: 800;
}

.nav-right {
    display: flex;
    align-items: center;
    gap: 15px;
}

.back-button {
    color: white;

    text-decoration: none;

    font-weight: 600;

    padding: 8px 14px;

    border-radius: 20px;

    transition: 0.3s;
}

.back-button:hover {
    background: rgba(255,255,255,0.08);

    color: var(--primary-light);
}

.cart {
    position: relative;

    font-size: 1.6rem;

    cursor: pointer;

    color: var(--primary);
}

.cart-count {
    position: absolute;

    top: -8px;
    right: -10px;

    min-width: 20px;
    height: 20px;

    display: flex;
    justify-content: center;
    align-items: center;

    background: white;

    color: var(--primary);

    border-radius: 50%;

    font-size: 0.75rem;

    font-weight: 800;
}


/* =====================================================
   TEST 4 — NADPIS
   ===================================================== */

header {
    text-align: center;

    padding: 45px 20px 25px;
}

header h1 {
    color: var(--primary);

    font-size: 2.8rem;

    margin-bottom: 10px;
}

header p {
    color: #ddd;

    max-width: 700px;

    margin: auto;

    line-height: 1.6;
}


/* =====================================================
   TEST 5 — VYHLEDÁVÁNÍ
   ===================================================== */

.search-area {
    max-width: 700px;

    margin: 10px auto 25px;

    padding: 0 20px;
}

.search-input {
    width: 100%;

    padding: 15px 18px;

    border: none;

    outline: none;

    border-radius: 30px;

    background: #161616;

    color: white;

    font-size: 1rem;

    box-shadow:
        0 5px 25px rgba(0,0,0,0.35);

    border: 1px solid rgba(255,255,255,0.05);
}

.search-input:focus {
    border-color: var(--primary);
}


/* =====================================================
   TEST 6 — KATEGORIE
   ===================================================== */

.categories {
    max-width: 1200px;

    margin: 0 auto;

    padding: 0 20px 25px;

    display: flex;

    justify-content: center;

    gap: 10px;

    flex-wrap: wrap;
}

.category-btn {
    border: none;

    background: rgba(255,255,255,0.06);

    color: white;

    padding: 10px 16px;

    border-radius: 25px;

    cursor: pointer;

    font-weight: 700;

    transition: 0.3s;
}

.category-btn:hover {
    background: rgba(255,255,255,0.12);
}

.category-btn.active {
    background: linear-gradient(
        90deg,
        var(--primary),
        var(--primary-light)
    );

    box-shadow:
        0 5px 20px rgba(255,60,60,0.2);
}


/* =====================================================
   TEST 7 — GALERIE PRODUKTŮ
   ===================================================== */

.gallery {
    max-width: 1200px;

    margin: auto;

    padding: 10px 20px 50px;

    display: grid;

    grid-template-columns:
        repeat(
            auto-fit,
            minmax(240px, 1fr)
        );

    gap: 25px;
}


/* =====================================================
   TEST 8 — PRODUKTOVÁ KARTA
   ===================================================== */

.card {
    background: rgba(30,30,30,0.90);

    border-radius: 16px;

    overflow: hidden;

    box-shadow:
        0 8px 25px rgba(0,0,0,0.5);

    transition:
        transform 0.25s,
        box-shadow 0.25s;
}

.card:hover {
    transform: translateY(-8px);

    box-shadow:
        0 20px 40px rgba(255,60,60,0.15);
}


/* =====================================================
   TEST 9 — OBRÁZEK PRODUKTU
   ===================================================== */

.product-image {
    width: 100%;

    height: 230px;

    object-fit: cover;

    display: block;

    background: #292929;
}


/* =====================================================
   TEST 10 — INFORMACE PRODUKTU
   ===================================================== */

.card-content {
    padding: 18px;

    text-align: center;
}

.card-content h3 {
    font-size: 1.1rem;

    margin-bottom: 7px;
}

.category-name {
    color: var(--muted);

    font-size: 0.85rem;

    margin-bottom: 10px;
}

.price {
    color: var(--primary-light);

    font-weight: 800;

    font-size: 1.1rem;

    margin-bottom: 15px;
}


/* =====================================================
   TEST 11 — TLAČÍTKO KOŠÍKU
   ===================================================== */

.add-button {
    border: none;

    background: var(--primary);

    color: white;

    padding: 10px 18px;

    border-radius: 25px;

    cursor: pointer;

    font-weight: 700;

    transition: 0.3s;
}

.add-button:hover {
    background: var(--primary-light);

    transform: scale(1.05);
}


/* =====================================================
   TEST 12 — ZPRÁVA O PRÁZDNÉM VÝSLEDKU
   ===================================================== */

.no-products {
    grid-column: 1 / -1;

    text-align: center;

    padding: 50px;

    color: var(--muted);

    font-size: 1.1rem;
}


/* =====================================================
   TEST 13 — FOOTER
   ===================================================== */

footer {
    background: rgba(15,15,15,0.9);

    text-align: center;

    color: #ccc;

    padding: 30px 20px;

    margin-top: 20px;
}


/* =====================================================
   TEST 14 — MOBIL
   ===================================================== */

@media (max-width: 700px) {

    .navbar {
        padding: 1rem;
    }

    .logo {
        font-size: 1.25rem;
    }

    .back-button {
        font-size: 0.85rem;
    }

    header h1 {
        font-size: 2.2rem;
    }

    .gallery {
        grid-template-columns: 1fr;

        padding-left: 15px;
        padding-right: 15px;
    }

    .product-image {
        height: 250px;
    }
}

</style>
</head>


<body>


<!-- =====================================================
     TEST 15 — POZADÍ
     ===================================================== -->

<div class="flame-bg"></div>


<!-- =====================================================
     TEST 16 — NAVIGACE
     ===================================================== -->

<nav class="navbar">

    <div class="logo">
        MarťasDesign
    </div>

    <div class="nav-right">

        <a
            href="./index.html"
            class="back-button"
        >
            ← Zpět
        </a>

        <div
            class="cart"
            id="cartButton"
            title="Košík"
        >
            🛒

            <span
                class="cart-count"
                id="cartCount"
            >
                0
            </span>

        </div>

    </div>

</nav>


<!-- =====================================================
     TEST 17 — HLAVIČKA
     ===================================================== -->

<header>

    <h1>
        Galerie produktů
    </h1>

    <p>
        Vyber si z našich návrhů oblečení,
        bot, doplňků a koberců.
    </p>

</header>


<!-- =====================================================
     TEST 18 — VYHLEDÁVÁNÍ
     ===================================================== -->

<div class="search-area">

    <input
        type="text"
        id="searchInput"
        class="search-input"
        placeholder="🔎 Hledat produkt..."
    >

</div>


<!-- =====================================================
     TEST 19 — KATEGORIE
     ===================================================== -->

<div
    class="categories"
    id="categories"
>

</div>


<!-- =====================================================
     TEST 20 — GALERIE
     ===================================================== -->

<main>

    <div
        class="gallery"
        id="gallery"
    >

    </div>

</main>


<!-- =====================================================
     TEST 21 — FOOTER
     ===================================================== -->

<footer>

    <p>
        © 2025 MarťasDesign BETA Version 0.4
    </p>

    <p>
        Navrženo s ❤️
    </p>

</footer>


<script>

/* =====================================================
   TEST 22 — PRODUKTY
   ===================================================== */

/*
   Každý produkt má:

   name  = název
   category = kategorie
   price = cena
   image = obrázek
*/

const products = [

    /* ================= ČEPICE ================= */

    {
        name: "Čepice Classic",
        category: "Čepice",
        price: 499,
        image: "https://images.unsplash.com/photo-1521369909029-2afed882baee?auto=format&fit=crop&w=800&q=80"
    },

    {
        name: "Čepice Sport",
        category: "Čepice",
        price: 549,
        image: "https://images.unsplash.com/photo-1575428652377-a2d80e2277fc?auto=format&fit=crop&w=800&q=80"
    },

    {
        name: "Čepice Street",
        category: "Čepice",
        price: 599,
        image: "https://images.unsplash.com/photo-1576871337632-b9aef4c17ab9?auto=format&fit=crop&w=800&q=80"
    },


    /* ================= MIKINY ================= */

    {
        name: "Mikina Comfort",
        category: "Mikiny",
        price: 999,
        image: "https://images.unsplash.com/photo-1556821840-3a63f95609a7?auto=format&fit=crop&w=800&q=80"
    },

    {
        name: "Mikina Oversize",
        category: "Mikiny",
        price: 1199,
        image: "https://images.unsplash.com/photo-1578681994506-b8f463449011?auto=format&fit=crop&w=800&q=80"
    },

    {
        name: "Mikina Street",
        category: "Mikiny",
        price: 1099,
        image: "https://images.unsplash.com/photo-1620799140408-edc6dcb6d633?auto=format&fit=crop&w=800&q=80"
    },


    /* ================= TRIČKA ================= */

    {
        name: "Tričko Basic",
        category: "Trička",
        price: 499,
        image: "https://images.unsplash.com/photo-1521572163474-6864f9cf17ab?auto=format&fit=crop&w=800&q=80"
    },

    {
        name: "Tričko Premium",
        category: "Trička",
        price: 649,
        image: "https://images.unsplash.com/photo-1503341504253-dff4815485f1?auto=format&fit=crop&w=800&q=80"
    },

    {
        name: "Tričko Urban",
        category: "Trička",
        price: 599,
        image: "https://images.unsplash.com/photo-1562157873-818bc0726f68?auto=format&fit=crop&w=800&q=80"
    },


    /* ================= KRAŤASY ================= */

    {
        name: "Kraťasy Sport",
        category: "Kraťasy",
        price: 699,
        image: "https://images.unsplash.com/photo-1591195853828-11db59a44f6b?auto=format&fit=crop&w=800&q=80"
    },

    {
        name: "Kraťasy Casual",
        category: "Kraťasy",
        price: 749,
        image: "https://images.unsplash.com/photo-1565084888279-aca607ecce0c?auto=format&fit=crop&w=800&q=80"
    },


    /* ================= KALHOTY ================= */

    {
        name: "Kalhoty Cargo",
        category: "Kalhoty",
        price: 1099,
        image: "https://images.unsplash.com/photo-1624378439575-d8705ad7ae80?auto=format&fit=crop&w=800&q=80"
    },

    {
        name: "Kalhoty Classic",
        category: "Kalhoty",
        price: 999,
        image: "https://images.unsplash.com/photo-1473966968600-fa801b869a1a?auto=format&fit=crop&w=800&q=80"
    },


    /* ================= BOTY ================= */

    {
        name: "Boty Sport",
        category: "Boty",
        price: 1499,
        image: "https://images.unsplash.com/photo-1542291026-7eec264c27ff?auto=format&fit=crop&w=800&q=80"
    },

    {
        name: "Boty Classic",
        category: "Boty",
        price: 1699,
        image: "https://images.unsplash.com/photo-1549298916-b41d501d3772?auto=format&fit=crop&w=800&q=80"
    },


    /* ================= KOBERCE ================= */

    {
        name: "Koberec Modern",
        category: "Koberce",
        price: 1899,
        image: "https://images.unsplash.com/photo-1600166898405-da9535204843?auto=format&fit=crop&w=800&q=80"
    },

    {
        name: "Koberec Cozy",
        category: "Koberce",
        price: 2199,
        image: "https://images.unsplash.com/photo-1600566753086-00f18fb6b3ea?auto=format&fit=crop&w=800&q=80"
    }

];


/* =====================================================
   TEST 23 — PROMĚNNÉ
   ===================================================== */

const gallery = document.getElementById("gallery");

const categoriesElement =
    document.getElementById("categories");

const searchInput =
    document.getElementById("searchInput");

const cartCount =
    document.getElementById("cartCount");

const cartButton =
    document.getElementById("cartButton");


let selectedCategory = "Vše";

let cart = [];


/* =====================================================
   TEST 24 — KATEGORIE
   ===================================================== */

const categories = [
    "Vše",
    ...new Set(
        products.map(product => product.category)
    )
];


function renderCategories() {

    categoriesElement.innerHTML = "";

    categories.forEach(category => {

        const button =
            document.createElement("button");

        button.className = "category-btn";

        if (category === selectedCategory) {
            button.classList.add("active");
        }

        button.textContent = category;

        button.addEventListener(
            "click",
            () => {

                selectedCategory = category;

                renderCategories();

                renderProducts();

            }
        );

        categoriesElement.appendChild(button);

    });

}


/* =====================================================
   TEST 25 — ZOBRAZENÍ PRODUKTŮ
   ===================================================== */

function renderProducts() {

    gallery.innerHTML = "";

    const search =
        searchInput.value
            .toLowerCase()
            .trim();


    const filteredProducts =
        products.filter(product => {

            const categoryMatch =
                selectedCategory === "Vše" ||
                product.category === selectedCategory;


            const searchMatch =
                product.name
                    .toLowerCase()
                    .includes(search);


            return categoryMatch && searchMatch;

        });


    if (filteredProducts.length === 0) {

        gallery.innerHTML = `
            <div class="no-products">
                Žádné produkty nebyly nalezeny.
            </div>
        `;

        return;

    }


    filteredProducts.forEach(product => {

        const card =
            document.createElement("div");

        card.className = "card";


        card.innerHTML = `

            <img
                src="${product.image}"
                alt="${product.name}"
                class="product-image"
                loading="lazy"
            >

            <div class="card-content">

                <h3>
                    ${product.name}
                </h3>

                <div class="category-name">
                    ${product.category}
                </div>

                <div class="price">
                    ${product.price.toLocaleString("cs-CZ")} Kč
                </div>

                <button
                    class="add-button"
                    data-name="${product.name}"
                >
                    🛒 Přidat do košíku
                </button>

            </div>

        `;


        const button =
            card.querySelector(".add-button");


        button.addEventListener(
            "click",
            () => {

                addToCart(product);

            }
        );


        gallery.appendChild(card);

    });

}


/* =====================================================
   TEST 26 — PŘIDÁNÍ DO KOŠÍKU
   ===================================================== */

function addToCart(product) {

    cart.push(product);

    updateCartCount();

    alert(
        product.name +
        " bylo přidáno do košíku."
    );

}


/* =====================================================
   TEST 27 — POČET PRODUKTŮ V KOŠÍKU
   ===================================================== */

function updateCartCount() {

    cartCount.textContent =
        cart.length;

}


/* =====================================================
   TEST 28 — VYHLEDÁVÁNÍ
   ===================================================== */

searchInput.addEventListener(
    "input",
    () => {

        renderProducts();

    }
);


/* =====================================================
   TEST 29 — KOŠÍK
   ===================================================== */

cartButton.addEventListener(
    "click",
    () => {

        /*
          Zatím přesměrování
          na kosik.html
        */

        window.location.href =
            "./kosik.html";

    }
);


/* =====================================================
   TEST 30 — SPUŠTĚNÍ GALERIE
   ===================================================== */

renderCategories();

renderProducts();

</script>

</body>
</html>
