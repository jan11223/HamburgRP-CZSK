<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Košík — MarťasDesign</title>

<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;800&display=swap" rel="stylesheet">

<style>

:root {
    --primary: #ff3b3b;
    --primary-light: #ff5e5e;
    --dark: #111111;
    --card: #1e1e1e;
    --muted: #bdbdbd;
    --white: #ffffff;
}

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    font-family: 'Montserrat', sans-serif;
}

body {
    background: radial-gradient(circle at top, #3a0000, #151515);
    color: white;
    min-height: 100vh;
    overflow-x: hidden;
}

.flame-bg {
    position: fixed;
    inset: 0;

    background:
        radial-gradient(
            circle at 20% 120%,
            rgba(255,80,0,0.30),
            transparent 70%
        ),

        radial-gradient(
            circle at 80% 120%,
            rgba(255,20,0,0.22),
            transparent 70%
        ),

        radial-gradient(
            circle at 50% 120%,
            rgba(255,120,0,0.20),
            transparent 70%
        );

    filter: blur(60px);

    animation: flames 5s infinite alternate ease-in-out;

    z-index: -1;
}

@keyframes flames {

    from {
        transform: translateY(0);
    }

    to {
        transform: translateY(-30px);
    }
}

.navbar {
    position: sticky;
    top: 0;
    z-index: 1000;

    display: flex;
    justify-content: space-between;
    align-items: center;

    padding: 16px 30px;

    background: rgba(20,20,20,0.88);

    backdrop-filter: blur(10px);

    border-bottom: 1px solid rgba(255,255,255,0.05);
}

.logo {
    color: var(--primary);

    font-size: 1.6rem;

    font-weight: 800;
}

.nav-links {
    display: flex;
    align-items: center;

    gap: 20px;
}

.back-link {
    color: white;

    text-decoration: none;

    font-weight: 700;

    transition: 0.3s;
}

.back-link:hover {
    color: var(--primary-light);
}

.cart-icon {
    font-size: 1.6rem;
}

main {
    width: 100%;

    max-width: 1000px;

    margin: 0 auto;

    padding: 45px 20px 70px;
}

h1 {
    text-align: center;

    color: var(--primary);

    font-size: 2.8rem;

    margin-bottom: 35px;

    text-shadow:
        0 0 20px rgba(255,60,60,0.3);
}

#cart-container {
    width: 100%;
}

.empty-cart {
    text-align: center;

    padding: 50px 20px;

    background: rgba(30,30,30,0.8);

    border-radius: 16px;

    color: var(--muted);

    font-size: 1.1rem;
}

.empty-cart .empty-icon {
    display: block;

    font-size: 4rem;

    margin-bottom: 20px;
}

.cart-item {
    display: flex;

    align-items: center;

    gap: 20px;

    width: 100%;

    background: rgba(30,30,30,0.9);

    border-radius: 16px;

    padding: 15px;

    margin-bottom: 15px;

    box-shadow:
        0 7px 20px rgba(0,0,0,0.4);

    transition: 0.25s;
}

.cart-item:hover {
    transform: translateY(-3px);

    box-shadow:
        0 15px 30px rgba(255,60,60,0.10);
}

.cart-image {
    width: 110px;

    height: 100px;

    object-fit: cover;

    border-radius: 12px;

    background: #292929;

    flex-shrink: 0;
}

.cart-info {
    flex: 1;
}

.cart-info h3 {
    font-size: 1.05rem;

    margin-bottom: 6px;
}

.cart-category {
    color: var(--muted);

    font-size: 0.85rem;

    margin-bottom: 8px;
}

.cart-price {
    color: var(--primary-light);

    font-weight: 800;
}

.quantity {
    display: flex;

    align-items: center;

    gap: 8px;
}

.quantity button {
    width: 32px;

    height: 32px;

    border: none;

    border-radius: 50%;

    background: var(--primary);

    color: white;

    cursor: pointer;

    font-size: 1rem;

    font-weight: 800;
}

.quantity button:hover {
    background: var(--primary-light);
}

.quantity-number {
    min-width: 25px;

    text-align: center;

    font-weight: 800;
}

.item-total {
    min-width: 100px;

    text-align: right;

    color: white;

    font-weight: 800;
}

.remove-button {
    border: none;

    background: transparent;

    color: #ff7777;

    cursor: pointer;

    font-size: 0.85rem;

    font-weight: 700;
}

.remove-button:hover {
    color: red;
}

.cart-summary {
    margin-top: 25px;

    background: rgba(30,30,30,0.9);

    border-radius: 16px;

    padding: 25px;

    box-shadow:
        0 7px 20px rgba(0,0,0,0.4);
}

.summary-row {
    display: flex;

    justify-content: space-between;

    align-items: center;

    margin-bottom: 12px;

    color: #ddd;
}

.summary-total {
    display: flex;

    justify-content: space-between;

    align-items: center;

    padding-top: 15px;

    margin-top: 15px;

    border-top: 1px solid rgba(255,255,255,0.1);

    font-size: 1.3rem;

    font-weight: 800;
}

.summary-total span:last-child {
    color: var(--primary-light);
}

.buttons {
    display: flex;

    justify-content: center;

    gap: 12px;

    flex-wrap: wrap;

    margin-top: 25px;
}

.main-button {
    border: none;

    background: var(--primary);

    color: white;

    padding: 12px 24px;

    border-radius: 30px;

    cursor: pointer;

    font-weight: 700;

    font-size: 1rem;

    text-decoration: none;

    transition: 0.25s;
}

.main-button:hover {
    background: var(--primary-light);

    transform: translateY(-2px);

    box-shadow:
        0 8px 20px rgba(255,60,60,0.25);
}

.secondary-button {
    background: rgba(255,255,255,0.08);
}

.secondary-button:hover {
    background: rgba(255,255,255,0.14);
}

#form-modal {
    display: none;

    position: fixed;

    inset: 0;

    background: rgba(0,0,0,0.85);

    backdrop-filter: blur(6px);

    z-index: 2000;

    justify-content: center;

    align-items: center;

    padding: 20px;
}

#form-content {
    width: 100%;

    max-width: 500px;

    background: #1c1c1c;

    border-radius: 20px;

    padding: 30px;

    position: relative;

    box-shadow:
        0 20px 60px rgba(0,0,0,0.7);
}

#form-content h2 {
    text-align: center;

    color: var(--primary);

    margin-bottom: 20px;
}

#close-modal {
    position: absolute;

    right: 15px;

    top: 12px;

    background: transparent;

    border: none;

    color: white;

    font-size: 1.8rem;

    cursor: pointer;
}

#order-form {
    display: flex;

    flex-direction: column;

    gap: 12px;
}

#order-form input,
#order-form textarea {
    width: 100%;

    border: none;

    outline: none;

    border-radius: 10px;

    padding: 13px;

    background: #292929;

    color: white;

    font-size: 0.95rem;
}

#order-form textarea {
    min-height: 100px;

    resize: vertical;
}

#order-form input:focus,
#order-form textarea:focus {
    outline: 1px solid var(--primary);
}

#thankyou {
    display: none;

    max-width: 700px;

    margin: 0 auto 50px;

    text-align: center;

    background: rgba(30,30,30,0.9);

    border-radius: 16px;

    padding: 30px;
}

#thankyou h2 {
    color: var(--primary);

    margin-bottom: 10px;
}

.discount-code {
    color: var(--primary-light);

    font-weight: 800;

    font-size: 1.3rem;

    margin-top: 8px;
}

footer {
    background: rgba(15,15,15,0.95);

    text-align: center;

    color: #ccc;

    padding: 30px 20px;
}

footer p {
    margin: 5px 0;
}

footer a {
    color: var(--primary);

    text-decoration: none;
}

@media (max-width: 700px) {

    .navbar {
        padding: 15px;
    }

    .logo {
        font-size: 1.3rem;
    }

    main {
        padding: 35px 15px 50px;
    }

    h1 {
        font-size: 2.2rem;
    }

    .cart-item {
        flex-wrap: wrap;
    }

    .cart-image {
        width: 90px;
        height: 85px;
    }

    .item-total {
        min-width: auto;

        margin-left: auto;
    }

    .quantity {
        margin-left: auto;
    }
}

</style>
</head>

<body>

<div class="flame-bg"></div>

<nav class="navbar">

    <div class="logo">
        MarťasDesign
    </div>

    <div class="nav-links">

        <a
            href="./galerie.html"
            class="back-link"
        >
            ← Galerie
        </a>

        <div class="cart-icon">
            🛒
        </div>

    </div>

</nav>

<main>

    <h1>
        Tvůj košík
    </h1>

    <div id="cart-container"></div>

</main>

<div id="form-modal">

    <div id="form-content">

        <button id="close-modal">
            ×
        </button>

        <h2>
            Odeslat objednávku
        </h2>

        <form id="order-form">

            <input
                type="text"
                id="contact"
                placeholder="E-mail nebo telefon"
                required
            >

            <textarea
                id="note"
                placeholder="Poznámka k objednávce (nepovinné)"
            ></textarea>

            <input
                type="text"
                id="discount-code"
                placeholder="Slevový kód"
            >

            <button
                type="submit"
                class="main-button"
            >
                Odeslat objednávku
            </button>

        </form>

    </div>

</div>

<div id="thankyou">

    <h2>
        🎉 Děkujeme za Vaši objednávku!
    </h2>

    <p>
        Objednávka byla připravena.
    </p>

    <p>
        Na další nákup máte 10 % slevu s kódem:
    </p>

    <div class="discount-code">
        MARTASDESIGN10
    </div>

</div>

<footer>

    <p>
        © 2025 MarťasDesign BETA Version 0.4
    </p>

    <p>
        Navrženo s ❤️
    </p>

</footer>

<script>

const STORAGE_KEY = "martasdesignCart";

let cart =
    JSON.parse(
        localStorage.getItem(STORAGE_KEY)
    ) || [];

let discountActive = false;


function saveCart() {

    localStorage.setItem(
        STORAGE_KEY,
        JSON.stringify(cart)
    );

}


function getTotalBeforeDiscount() {

    return cart.reduce(
        (total, item) => {

            return total +
                (Number(item.price) *
                Number(item.quantity));

        },
        0
    );

}


function getTotal() {

    const total =
        getTotalBeforeDiscount();

    if (discountActive) {

        return Math.round(total * 0.9);

    }

    return total;

}


function renderCart() {

    const container =
        document.getElementById(
            "cart-container"
        );

    container.innerHTML = "";


    if (!cart.length) {

        container.innerHTML = `

            <div class="empty-cart">

                <span class="empty-icon">
                    🛒
                </span>

                <p>
                    Košík je prázdný.
                </p>

                <div class="buttons">

                    <a
                        href="./galerie.html"
                        class="main-button"
                    >
                        Zobrazit galerii
                    </a>

                </div>

            </div>

        `;

        return;

    }


    cart.forEach((item, index) => {

        const div =
            document.createElement("div");

        div.className = "cart-item";


        const quantity =
            Number(item.quantity) || 1;

        const price =
            Number(item.price) || 0;

        const itemTotal =
            price * quantity;


        div.innerHTML = `

            <img
                src="${item.image || ''}"
                alt="${item.name}"
                class="cart-image"
            >

            <div class="cart-info">

                <h3>
                    ${item.name}
                </h3>

                <div class="cart-category">
                    ${item.category || ""}
                </div>

                <div class="cart-price">
                    ${price.toLocaleString("cs-CZ")} Kč / ks
                </div>

            </div>

            <div class="quantity">

                <button
                    data-action="minus"
                    data-index="${index}"
                >
                    −
                </button>

                <span class="quantity-number">
                    ${quantity}
                </span>

                <button
                    data-action="plus"
                    data-index="${index}"
                >
                    +
                </button>

            </div>

            <div class="item-total">
                ${itemTotal.toLocaleString("cs-CZ")} Kč
            </div>

            <button
                class="remove-button"
                data-action="remove"
                data-index="${index}"
            >
                Odebrat
            </button>

        `;

        container.appendChild(div);

    });


    const summary =
        document.createElement("div");

    summary.className =
        "cart-summary";


    const beforeDiscount =
        getTotalBeforeDiscount();

    const total =
        getTotal();


    summary.innerHTML = `

        <div class="summary-row">

            <span>
                Počet produktů
            </span>

            <span>
                ${cart.reduce(
                    (sum, item) =>
                        sum + Number(item.quantity),
                    0
                )}
            </span>

        </div>

        <div class="summary-row">

            <span>
                Cena před slevou
            </span>

            <span>
                ${beforeDiscount.toLocaleString("cs-CZ")} Kč
            </span>

        </div>

        ${
            discountActive
            ?
            `
            <div class="summary-row">

                <span>
                    Sleva 10 %
                </span>

                <span>
                    -${Math.round(
                        beforeDiscount * 0.1
                    ).toLocaleString("cs-CZ")} Kč
                </span>

            </div>
            `
            :
            ""
        }

        <div class="summary-total">

            <span>
                Celkem
            </span>

            <span>
                ${total.toLocaleString("cs-CZ")} Kč
            </span>

        </div>

        <div class="buttons">

            <a
                href="./galerie.html"
                class="main-button secondary-button"
            >
                Pokračovat v nákupu
            </a>

            <button
                id="checkout-button"
                class="main-button"
            >
                Dokončit objednávku
            </button>

        </div>

    `;


    container.appendChild(summary);


    document
        .querySelectorAll("[data-action]")
        .forEach(button => {

            button.addEventListener(
                "click",
                function() {

                    const index =
                        Number(
                            this.dataset.index
                        );

                    const action =
                        this.dataset.action;


                    if (action === "plus") {

                        cart[index].quantity += 1;

                    }


                    if (action === "minus") {

                        cart[index].quantity -= 1;


                        if (
                            cart[index].quantity <= 0
                        ) {

                            cart.splice(index, 1);

                        }

                    }


                    if (action === "remove") {

                        cart.splice(index, 1);

                    }


                    saveCart();

                    renderCart();

                }
            );

        });


    const checkoutButton =
        document.getElementById(
            "checkout-button"
        );


    if (checkoutButton) {

        checkoutButton.addEventListener(
            "click",
            function() {

                document.getElementById(
                    "form-modal"
                ).style.display = "flex";

            }
        );

    }

}


document
    .getElementById("close-modal")
    .addEventListener(
        "click",
        function() {

            document.getElementById(
                "form-modal"
            ).style.display = "none";

        }
    );


document
    .getElementById("form-modal")
    .addEventListener(
        "click",
        function(event) {

            if (
                event.target === this
            ) {

                this.style.display = "none";

            }

        }
    );


document
    .getElementById("order-form")
    .addEventListener(
        "submit",
        function(event) {

            event.preventDefault();


            const code =
                document
                    .getElementById(
                        "discount-code"
                    )
                    .value
                    .trim()
                    .toUpperCase();


            discountActive =
                code === "MARTASDESIGN10";


            const contact =
                document
                    .getElementById(
                        "contact"
                    )
                    .value
                    .trim();


            if (!contact) {

                return;

            }


            cart = [];

            saveCart();


            document.getElementById(
                "form-modal"
            ).style.display = "none";


            document.getElementById(
                "thankyou"
            ).style.display = "block";


            renderCart();

        }
    );


renderCart();

</script>

</body>
</html>
